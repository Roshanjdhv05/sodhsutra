name: Daily Database Ping Cron

on:
  schedule:
    # Runs daily at midnight UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

jobs:
  ping-database:
    name: Ping Database & Keep Alive
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Cron API Call
        run: |
          echo "Starting daily database keepalive call..."
          STATUS=$(curl -s -o response.json -w "%{http_code}" "https://shodhsutra.in/api/cron")
          echo "HTTP Status: $STATUS"
          cat response.json
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Successfully pinged database!"
            exit 0
          else
            echo "Warning: Database ping returned status $STATUS"
            # Don't fail the workflow if domain DNS is still propagating
            exit 0
          fi

